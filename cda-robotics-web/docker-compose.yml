services:
    postgres:
        image: postgres:17
        container_name: cda_db_local
        restart: unless-stopped
        environment:
            POSTGRES_USER: cda
            POSTGRES_PASSWORD: dev_local_2026
            POSTGRES_DB: cda_robotics
        ports:
            - "5432:5432" 
        volumes:
            - cda_pgdata:/var/lib/postgresql/data

volumes:
    cda_pgdata:    
